# Configuración CORRECTA del ejercicio 03.
# Sustituye a sonar-project.properties cuando termines el paso 8.
#
# Ejecútala con:
#   sonar-scanner -c sonar-project.final.properties

sonar.projectKey=devsecops-lab-03
sonar.projectName=DevSecOps Lab 03 - Exclusiones y falsos positivos
sonar.projectVersion=1.0.0

sonar.sources=src,vendor
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# ─────────────────────────────────────────────────────────────────────────────
# 1. EXCLUSIÓN POR RUTA: código generado que nadie va a mantener
# ─────────────────────────────────────────────────────────────────────────────
sonar.exclusions=**/vendor/**,**/migraciones/**

# ─────────────────────────────────────────────────────────────────────────────
# 2. EXCLUSIÓN POR PATRÓN DE FICHERO
# ─────────────────────────────────────────────────────────────────────────────
sonar.exclusions=**/*.min.js,**/*.min.css,**/*_pb2.py,**/*.generated.ts

# ─────────────────────────────────────────────────────────────────────────────
# 3. EXCLUSIÓN DE LA COBERTURA
#    La cobertura solo tiene sentido sobre código que se puede testear.
# ─────────────────────────────────────────────────────────────────────────────
sonar.coverage.exclusions=**/vendor/**,**/config/**,**/*_pb2.py,**/setup.py,**/__main__.py

# ─────────────────────────────────────────────────────────────────────────────
# 4. EXCLUSIÓN DE LA DETECCIÓN DE DUPLICACIÓN (CPD)
#    Los ficheros de tests y los de datos legítimamente repetitivos
#    generan duplicación que no es deuda técnica real.
# ─────────────────────────────────────────────────────────────────────────────
sonar.cpd.exclusions=**/vendor/**,**/tests/**,**/fixtures/**,**/*_pb2.py

# ─────────────────────────────────────────────────────────────────────────────
# 5. EXCLUSIÓN DE LA PRUEBA DE DUPLICACIÓN EN LAS PRUEBAS
# ─────────────────────────────────────────────────────────────────────────────
sonar.cpd.python.tests.exclusions=**/tests/**