# Definición de nuevo código: se configura en la UI, no aquí.
# Project Settings → New Code →  Previous version
#
# La configuración clave del ejercicio:
#   · New Code Definition  = "Previous version"
#   · Fudge factor         = activado
# En esas condiciones, el Quality Gate "Sonar way" evalúa SOLO el código nuevo.