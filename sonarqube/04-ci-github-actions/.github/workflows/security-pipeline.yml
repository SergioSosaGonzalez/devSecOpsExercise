# Versión completa: tests + cobertura + SonarQube + Quality Gate.
# Usa esta cuando el proyecto tenga tests (Python de ejemplo).
#
# El ORDEN importa:
#   1. Instalar dependencias
#   2. Ejecutar tests con cobertura
#   3. Convertir el informe al formato de SonarQube
#   4. Analizar
#   5. Verificar el Quality Gate

name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Capa 1 — rápida y bloqueante (segundos)
  # ─────────────────────────────────────────────────────────────────────────────
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detectar secretos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Capa 2 — lenta y profunda (minutos)
  # Solo se ejecuta si la capa 1 pasó: no tiene sentido analizar un PR
  # que ya está bloqueado por un secreto filtrado.
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gate (SonarQube)
    needs: secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov python-sonar-coverage

      - name: Ejecutar tests con cobertura
        run: |
          python -m pytest \
            --cov=. \
            --cov-report=xml \
            --cov-config=sonar-project.properties

      - name: Convertir informe de cobertura
        run: python-coveragexml -o coverage.xml

      - name: Ejecutar análisis SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PYTHON_COVERAGE_REPORT_PATHS: coverage.xml

      - name: Verificar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}