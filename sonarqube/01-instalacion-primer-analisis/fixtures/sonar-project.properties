# ==============================================================================
# Configuración de análisis - Ejercicio 01
# ==============================================================================
# Este archivo es la configuración que lee SonarScanner CLI.
# Ejecútalo DESDE ESTE DIRECTORIO con:  sonar-scanner

sonar.projectKey=devsecops-lab-01
sonar.projectName=DevSecOps Lab 01 - Primer analisis
sonar.projectVersion=1.0.0

# Directorios que se analizan
sonar.sources=src
sonar.tests=tests

# Codificación de los ficheros de origen
sonar.sourceEncoding=UTF-8

# --- Ajuste de la cobertura (ver ejercicio 02) ---
# El scanner NO genera la cobertura: solo lee un informe Cobertura XML.
#   pip install pytest-cov
#   python -m pytest --cov=. --cov-report=xml:coverage.xml
# y descomenta la línea de abajo para que el scanner lo encuentre solo:
#sonar.python.coverage.reportPaths=coverage.xml
#
# Equivalente sin pytest-cov:
#   coverage run -m pytest
#   coverage xml